# L1 结构化事实：mod 中文名称 → Modrinth 项目映射（§8.9）
# 来源：Modrinth API v2 实测核对；采集日期 2026-08-30（v0.9 全表复核）
# 重要：2026-08 实测 Modrinth project 端点仅支持 project_id（按 slug 查询已 404），
# 故本表存 project_id；slug 仅用于生成可读的方案名（spec_id）。
# search_mods 工具先查本表，未命中再走 Modrinth 文本检索——
# 从机制上根治通用 Agent "不知道英文标识就编一个" 的幻觉。
